[package]
name = "acpsub"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Any ACP agent as a resumable subagent over MCP"
repository = "https://github.com/lexoliu/acpsub"
keywords = ["acp", "mcp", "agent", "subagent"]
categories = ["api-bindings", "command-line-utilities"]

[dependencies]
aither-core = "0.4"
aither-mcp = { version = "0.4", default-features = false, features = ["server", "client"] }
aither-acp = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
toml = "0.9"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
async-process = "2"
async-net = "2"
libc = "0.2"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# aither's ToolContext (per-call progress reporting) is not released yet:
# consume every aither crate from the exact upstream commit that lands it,
# never a moving branch, until a release carries it.
[patch.crates-io]
aither-core = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-mcp = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-acp = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-agent = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-attachments = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-derive = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }
aither-sandbox = { git = "https://github.com/lexoliu/aither", rev = "01f728894d88d7aa263cbd118728aed1d48b6f6d" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"