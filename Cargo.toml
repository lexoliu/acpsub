[package]
name = "acpsub"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
description = "Any ACP agent as a resumable subagent over MCP"
repository = "https://github.com/lexoliu/acpsub"
keywords = ["acp", "mcp", "agent", "subagent"]
categories = ["api-bindings", "command-line-utilities"]

[features]
default = ["cli", "sessions-db"]
# Find an adopted session's cwd in the agent's SQLite session database.
sessions-db = ["dep:rusqlite"]
# The `acpsub` binary and its own dependencies.
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "acpsub"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
aither-core = { version = "0.20.0", default-features = false }
aither-mcp = { version = "0.20.0", default-features = false, features = ["server", "client"] }
aither-acp = { version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
toml = "0.9"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures-lite = "2"
async-process = "2"
async-net = "2"
libc = "0.2"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
