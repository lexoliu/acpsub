[package]
name = "acpsub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Any ACP agent as a named, resumable subagent over MCP"
repository = "https://github.com/lexoliu/acpsub"
keywords = ["acp", "mcp", "agent", "subagent"]
categories = ["api-bindings", "command-line-utilities"]

[dependencies]
aither-core = { git = "https://github.com/lexoliu/aither", branch = "feat/acp-client" }
aither-mcp = { git = "https://github.com/lexoliu/aither", branch = "feat/acp-client", default-features = false, features = ["server", "client"] }
aither-acp = { git = "https://github.com/lexoliu/aither", branch = "feat/acp-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
toml = "0.9"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
async-process = "2"
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
