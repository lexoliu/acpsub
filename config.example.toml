# Copy to ~/.config/acpsub/config.toml (or pass --config PATH).

[defaults]
# Permission policy applied when an agent asks to run a tool call:
#   allow - pick the first allow_once/allow_always option
#   deny  - pick the first reject_once/reject_always option
#   ask   - queue the request; the `permit` tool answers it
permission = "allow"
transcript_dir = "~/.local/share/acpsub/transcripts"
registry = "~/.local/share/acpsub/registry.json"
# agent = "devin"                        # default backend for spawn/adopt
                                       # (a single configured agent is the
                                       #  implicit default; omitting `agent`
                                       #  with several configured errors)

# [agents.<name>] only describes how to launch the agent. Session options
# are per-call `spawn`/`adopt` arguments: `model` and `mode` are required
# when the agent advertises a `model` option / session modes and must be
# omitted when it does not; other `session/set_config_option` values can
# be passed via `config`.
[agents.devin]
command = "devin"
args = ["acp"]
allow_outside_cwd = false                # refuse fs/* paths outside cwd
# env = { API_KEY = "..." }              # extra environment for the process
# permission = "ask"                     # per-agent override of the default
# steer = "folded"                       # answered | folded — what a mid-turn
                                       # `send` steer becomes; `folded` agents
                                       # (codex-acp) fold the prompt into the
                                       # running turn and never answer the
                                       # request, so acpsub settles it when
                                       # that turn ends
# sessions_db = "~/path/sessions.db"     # sqlite db mapping session id -> cwd
                                       # for `adopt` without an explicit cwd
                                       # (devin defaults to its own store)

[agents.claude]
command = "npx"
args = ["-y", "@zed-industries/claude-code-acp"]
